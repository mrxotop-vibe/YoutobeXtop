name: Build SmartXtopTV Android 5.1 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK (minSdk 21 - Android 5.1+)
        working-directory: SmartXtopTV
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload SmartXtopTV APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartXtopTV-Android5.1-APK
          path: SmartXtopTV/app/build/outputs/apk/debug/app-debug.apk
