plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartxtoptv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartxtoptv.app"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "2.1.0-Android5.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Real YouTube Extractor with Mozilla Rhino JS engine (signatureCipher + n-challenge)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.0'

    // Real ExoPlayer (DASH adaptive merging, HLS, Playback Speed on Android 5.1+)
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'

    // Networking & Image Loader
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
